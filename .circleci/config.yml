# Generated by yurielk82/global-rules: ci/circleci.py
# 모든 저장소에 같은 파일이다. 무엇을 검사할지·실행기 크기는 global-rules targets/quality.json 이 정한다.
# 손으로 고치지 않는다.
version: 2.1
setup: true

parameters:
  schedule:
    type: string
    default: ""

jobs:
  setup:
    docker:
      - image: cimg/node:24.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: 중앙 규칙 받기와 필요한 검사 고르기
          command: |
            install -d -m 700 ~/.ssh
            printf '%s' "$GLOBAL_RULES_DEPLOY_KEY" | base64 -d > ~/.ssh/global_rules
            chmod 600 ~/.ssh/global_rules
            GIT_SSH_COMMAND="ssh -i ~/.ssh/global_rules -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git clone --quiet --depth 1 git@github.com:yurielk82/global-rules.git ~/global-rules
            rm -f ~/.ssh/global_rules
            CI_SCHEDULE="<< pipeline.parameters.schedule >>" python3 ~/global-rules/ci/circleci.py setup

workflows:
  setup:
    unless: << pipeline.parameters.schedule >>
    jobs:
      - setup:
          context:
            - global-rules
          filters:
            branches:
              ignore:
                - main
                - master
  scheduled:
    when: << pipeline.parameters.schedule >>
    jobs:
      - setup:
          context:
            - global-rules

name: CI

'on':
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: 0 18 * * *
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      REF_HUB_OFFLINE_CONTENT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: install
        run: npm ci

      - name: test
        run: npm test

      - name: typecheck
        run: npx tsc --noEmit --pretty false

        # CI validates committed content snapshots because source submodules are private.
        # The bounded trial deploy uses the same snapshots after both push workflows pass.
      - name: build
        run: npm run build
